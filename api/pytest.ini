[pytest]
asyncio_mode = auto
; The Motor client (app/db/mongodb.py) is a module-level singleton bound to
; whatever event loop first created it. pytest-asyncio's default is a fresh
; loop per test function, which orphans that singleton after the first async
; test and raises "Event loop is closed". Pin one loop for the whole session
; instead, matching how a real long-lived FastAPI process actually runs.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
